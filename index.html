<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Тестирование опытного производства поддонов</title>
</head>
<body>
<script>
(async function () {
  try { localStorage.setItem("opp_access_v1", JSON.stringify({ "1": true })); } catch (e) {}
  // Открыть модуль 1 на общем сервере доступа
  try {
    await fetch("https://abacus.jasoncameron.dev/set/opp-pallet/module1?value=1", {
      method: "POST",
      headers: { Authorization: "Bearer 96ae5f9d-549c-42b6-870d-a54ab46e150e" }
    });
  } catch (e) {}
  var base = "https://cdn.jsdelivr.net/gh/poddon/opp-pallet@c3c00d1e3d54253b10c1205da96edd3391117eeb/";
  var html = await (await fetch(base + "index.html")).text();
  html = html.replace(/<div class="strip"[^>]*>[\s\S]*?<\/div>/, "");
  html = html.replace(/\.strip\s*\{[^}]+\}/g, ".strip{display:none!important}");
  html = html.replace(/src="(matter\.min\.js|questions\.js[^"]*|factory\.js[^"]*|app\.js[^"]*)"/g, function (_, f) {
    return 'src="' + base + f + '"';
  });
  var inject = '<script>(function(){try{localStorage.setItem("opp_access_v1",JSON.stringify({"1":true}));}catch(e){}var _g=Document.prototype.getElementById;document.getElementById=function(i){var e=_g.call(document,i);if(!e&&i==="strip")return{className:"",textContent:"",style:{},classList:{add:function(){},remove:function(){},toggle:function(){}}};return e;};})();<\/script>';
  html = html.replace(/(<script src="[^"]*app\.js"><\/script>)/, inject + "$1");
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
