<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Итоговое тестирование по СК ОПП</title>
  <link rel="stylesheet" href="/portal.css">
  <link rel="stylesheet" href="/brand.css">
  <link rel="stylesheet" href="/student-brand.css">
  <script defer src="/common.js"></script>
  <script defer src="/student.js"></script>
</head>
<body class="portal-theme">
<main class="student-page">
  <p id="message" class="error" role="status"></p>
  <section id="registration" class="brand-login student-login" aria-labelledby="studentTitle">
    <div class="brand-hero">
      <img class="brand-logo" src="/logo-alabuga-white.png" alt="Алабуга" width="614" height="127">
      <h1 id="studentTitle">Итоговое тестирование по СК ОПП</h1>
      <img class="brand-robot" src="/robot-blueprint.svg" alt="" width="360" height="453">
      <div class="student-facts">
        <div><strong id="questionCount">—</strong>вопросов</div>
        <div><strong>55 с</strong>на ответ</div>
        <div><strong>1</strong>попытка</div>
      </div>
    </div>
    <div class="brand-entry">
      <h2>Вход в личный кабинет</h2>
      <p id="availability" class="muted">Загрузка групп…</p>
      <form id="entry" class="stack" hidden>
        <label>ФИО полностью
          <input name="name" autocomplete="name" maxlength="160" placeholder="Иванов Иван Иванович" required>
        </label>
        <label>Направление и номер группы
          <select name="group" id="studentGroup" required></select>
        </label>
        <label id="studentTestField" hidden>Тест
          <select id="studentTest" name="assignment"></select>
        </label>
        <div class="student-consent">
          <details><summary>Согласие на обработку персональных данных</summary><div id="consentText"></div></details>
          <label class="check"><input name="consent" type="checkbox" required> Даю согласие на обработку персональных данных на указанных условиях</label>
        </div>
        <label class="check student-rules"><input name="rules" type="checkbox" required> Я ознакомлен(а) с правилами тестирования. Переход на другую вкладку или сворачивание браузера засчитывается как списывание: попытка завершается с результатом 0%.</label>
        <button id="start">Начать тест</button>
      </form>
      <button type="button" id="refreshGroups" class="secondary" hidden>Обновить список</button>
    </div>
  </section>
  <section id="taking" class="card" hidden>
    <div class="question-top"><p id="position"></p><p id="timer" class="timer"></p></div>
    <progress id="progress"></progress>
    <h2 id="question"></h2>
    <form id="answer" class="stack">
      <div id="choices" class="stack"></div>
      <div class="actions">
        <button id="submitAnswer" disabled>Ответить</button>
        <button id="skip" class="secondary" type="button">Пропустить</button>
      </div>
    </form>
  </section>
  <section id="finished" class="card" hidden>
    <h1 id="resultTitle"></h1>
    <p id="score"></p>
    <button id="back" class="secondary">К списку тестов</button>
  </section>
</main>
<div id="cheat" role="alert" hidden>
  <div class="cheat-bg"></div>
  <div class="cheat-stripes"></div>
  <div class="cheat-beacon"></div>
  <div class="cheat-flash"></div>
  <div class="cheat-scan"></div>
  <div class="cheat-ring"></div>
  <div class="cheat-stamp">
    <div class="cheat-badge">НАРУШЕНИЕ РЕГЛАМЕНТА</div>
    <h2>СПИСАНО</h2>
    <p>Вы списали. Обратитесь к преподавателю.</p>
    <div class="cheat-who" id="cheatwho"></div>
  </div>
</div>
</body>
</html>
