name: Build Windows EXE
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opp
          POSTGRES_PASSWORD: opp-ci-password
          POSTGRES_DB: opp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: desktop/go.sum
      - name: Test against PostgreSQL
        env:
          OPP_TEST_POSTGRES: '1'
        run: go test -v ./...
      - name: Build Windows executable
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o OPP-test.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: OPP-test-windows-x64
          path: desktop/OPP-test.exe
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OPP-test-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: site-latest
          files: OPP-test.exe
          fail_on_unmatched_files: true
