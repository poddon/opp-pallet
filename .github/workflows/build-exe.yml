name: Build Windows EXE
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opp
          POSTGRES_PASSWORD: opp-ci-password
          POSTGRES_DB: opp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: desktop/go.sum
      - name: Test against PostgreSQL
        env:
          OPP_TEST_POSTGRES: '1'
        run: go test -v ./...
      - name: Build Windows executable
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o OPP-test.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: OPP-test-windows-x64
          path: |
            desktop/OPP-test.exe
            desktop/start.bat
          if-no-files-found: error
  windows-startup:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OPP-test-windows-x64
      - name: Check EXE startup and error handling
        shell: pwsh
        run: |
          $env:PGPASSWORD = 'pg-ci-secret'
          $help = & .\OPP-test.exe start --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'sslmode' -or $help -match 'ci-secret') {
            throw "Unexpected CLI help: $help"
          }
          $wizard = @('127.0.0.1', '1', 'opp', 'postgres', 'pg-ci-secret') |
            & .\OPP-test.exe 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $wizard -notmatch '127\.0\.0\.1:1 / opp' -or $wizard -match 'ci-secret') {
            throw "Unexpected startup output: $wizard"
          }
          Remove-Item Env:PGPASSWORD
          $example = & .\OPP-test.exe start --ip 127.0.0.1 --port 1 --name opp --password pg-example-secret 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $example -notmatch '127\.0\.0\.1:1 / opp' -or $example -match 'pg-example-secret') {
            throw "Unexpected result for the documented start command: $example"
          }
          (Get-Content start.bat -Encoding UTF8) `
            -replace '--ip localhost', '--ip 127.0.0.1' `
            -replace '--port 5432', '--port 1' `
            -replace '--name maxbot', '--name opp' `
            -replace '--password maxbotmaxbot', '--password bat-ci-secret' |
            Set-Content ci-start.bat -Encoding UTF8
          $bat = cmd /c "ci-start.bat < nul" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $bat -notmatch '127\.0\.0\.1:1 / opp' -or $bat -match 'bat-ci-secret') {
            throw "Unexpected start.bat result: $bat"
          }
          Write-Host "Windows startup and expected PostgreSQL error verified"
          exit 0
  release:
    if: github.ref == 'refs/heads/main'
    needs: windows-startup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OPP-test-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: site-latest
          files: |
            OPP-test.exe
            start.bat
          fail_on_unmatched_files: true
