name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Pack working site from gh-pages
        run: |
          mkdir -p desktop/web
          git checkout origin/gh-pages -- index.html app.js questions.js factory.js matter.min.js synology-config.js || true
          cp index.html app.js questions.js factory.js matter.min.js desktop/web/
          if [ -f synology-config.js ]; then cp synology-config.js desktop/web/; fi
          if [ -f desktop/synology-config.js ]; then cp desktop/synology-config.js desktop/web/; fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('desktop/web/index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="again"' not in s:
              s = s.replace(
                  '<button class="btn ghost" id="rescab" type="button">В личный кабинет</button>',
                  '<button class="btn ghost" id="rescab" type="button">В личный кабинет</button>\n      <button id="again" type="button" hidden></button>'
              )
              p.write_text(s, encoding='utf-8')
          a = Path('desktop/web/app.js')
          t = a.read_text(encoding='utf-8')
          t = t.replace('$("again").onclick', 'var _ag = document.getElementById("again"); if (_ag) _ag.onclick')
          a.write_text(t, encoding='utf-8')
          PY
      - name: Build OPP-test.exe
        working-directory: desktop
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o OPP-test.exe .
      - name: Attach to release site-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: site-latest
          files: desktop/OPP-test.exe
          fail_on_unmatched_files: true
