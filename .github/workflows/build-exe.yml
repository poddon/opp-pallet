name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Pack site into desktop/web
        run: |
          mkdir -p desktop/web
          cp index.html app.js questions.js factory.js matter.min.js desktop/web/
          cp desktop/synology-config.js desktop/web/
          test -f pg-config.js && cp pg-config.js desktop/web/ || true
      - name: Build OPP-test.exe
        working-directory: desktop
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o OPP-test.exe .
      - name: Attach to release site-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: site-latest
          files: desktop/OPP-test.exe
          fail_on_unmatched_files: true
